<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>নোটিশ কার্ড কম্বাইনার</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#071a4d;color:#fff;font-family:'FreeSerif','Noto Serif Bengali','Kalpurush','SolaimanLipi','Nirmala UI','Vrinda',serif;font-size:18px;min-height:100vh}
button{font-family:inherit;font-size:18px;padding:10px 20px;border:0;border-radius:30px;background:#2f8cff;color:#fff;cursor:pointer}
button.g{background:#ffd75e;color:#06143f}button.o{background:#1d3f86;border:2px solid #4fb3ff}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=date]{font-family:inherit;font-size:18px;padding:8px 10px;border-radius:10px;border:2px solid #4fb3ff;background:#102a70;color:#fff}
.wrap{max-width:1120px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:28px;color:#ffd75e;margin-bottom:4px}
.hint{color:#8fd0ff;font-size:16px;margin-bottom:14px}
#drop{border:3px dashed #4fb3ff;border-radius:24px;padding:30px 16px;text-align:center;background:#0b1f5c;cursor:pointer}
#drop.on{background:#14307a}#drop b{color:#ffd75e}
.file{display:flex;align-items:center;gap:10px;background:#1d3f86;border:2px solid #4fb3ff;border-radius:16px;padding:10px 14px;margin-top:10px}
.file span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file small{color:#8fd0ff}
.file .x{padding:4px 12px;background:#7a1d3a}
#bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}#bar label{color:#8fd0ff}
#rv{display:none}
#top{position:sticky;top:0;z-index:20;background:#0b1f5c;border-bottom:2px solid #2f6fd0;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
#cnt{color:#8fd0ff}#msg{text-align:center;color:#8fd0ff;min-height:24px;margin-top:8px;padding:0 10px}
.item{margin:18px auto;max-width:1120px;padding:0 10px}
.ih{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.ih b{flex:1;color:#ffd75e;min-width:160px}.warn{color:#ffb36b;font-size:16px;width:100%}
.ih label{display:flex;gap:6px;align-items:center;background:#1d3f86;border:2px solid #4fb3ff;border-radius:30px;padding:6px 14px;cursor:pointer}
.ih input{width:20px;height:20px}.ih .ex{padding:6px 14px;font-size:16px}
.holder{overflow:hidden;border-radius:12px;border:2px solid #2f6fd0}
.item.off .holder{opacity:.3}
.stage{transform-origin:0 0;width:1080px}
[contenteditable]:hover{outline:2px dashed #ffd75e;outline-offset:3px}
[contenteditable]:focus{outline:2px solid #ffd75e;outline-offset:3px}
.card{position:relative;width:1080px;min-height:1350px;background:#0a2468;overflow:hidden;padding:40px 70px 44px;color:#fff}
.edge{position:absolute;left:24px;right:24px;top:24px;bottom:24px;border:3px solid #4fb3ff;border-radius:34px}
.wm{position:absolute;left:90px;top:50%;margin-top:-450px;width:900px;height:900px;opacity:.10}
.z{position:relative}
.head{width:100%;border-collapse:collapse}.head td{vertical-align:middle}
.brand{font-size:46px;letter-spacing:3px}.tag{font-size:26px;color:#8fd0ff;margin-top:4px}
.title{text-align:center;margin-top:16px}
.pill{display:inline-block;background:#2f8cff;font-size:68px;line-height:1.2;padding:4px 50px 10px;border-radius:70px;border:4px solid #bfe3ff}
.sub{font-size:31px;color:#ffd75e;margin-top:8px;line-height:1.3}
.info{width:100%;margin-top:16px;border-collapse:separate;border-spacing:0}.info td{width:50%;vertical-align:top}
.box{background:#1d3f86;border:2px solid #4fb3ff;border-radius:24px;text-align:center;padding:8px 10px 14px}
.l{padding-right:10px}.r{padding-left:10px}
.lab{font-size:26px;color:#8fd0ff}.val{font-size:40px;margin-top:4px}
.marks{text-align:center;margin-top:14px}
.mk{display:inline-block;font-size:30px;color:#06143f;background:#ffd75e;border-radius:40px;padding:3px 30px 9px}
.sech{text-align:center;font-size:34px;color:#ffd75e;margin:14px 0 8px}
.row{border-radius:20px;overflow:hidden;margin-bottom:8px;border:2px solid #2f6fd0;background:#06174a}
.row table{width:100%;border-collapse:collapse}.row td{vertical-align:middle}
.row td.s{width:236px;text-align:center;line-height:1.2;color:#06143f}.row td.s i{display:block;font-style:normal}
.row td.t{padding-left:22px;padding-right:20px}
.c1{background:#7ee0a5}.c2{background:#ffb36b}.c3{background:#c7a6ff}.c4{background:#ff8fa8}.c5{background:#7fd3ff}
.foot{text-align:center;margin-top:20px}.best{font-size:38px;color:#ffd75e}
.web{font-size:26px;color:#8fd0ff;margin-top:4px;letter-spacing:1px}
</style></head><body>
<div id="home" class="wrap">
 <h1>নোটিশ কার্ড কম্বাইনার</h1>
 <div class="hint">CSV ফাইল আপলোড করুন (একাধিক হলে একসাথে) — ফার্মেসি, NFE, LLB বা নতুন যেকোনো সিরিজ। প্রতিটা সারি = একটা টেস্টের একটা বিষয়।</div>
 <div id="drop"><b>CSV এখানে ছাড়ুন</b> বা ক্লিক করে বাছুন<input type="file" id="fi" accept=".csv,text/csv" multiple hidden></div>
 <div id="list"></div>
 <div id="bar"><label>তারিখ</label><input type="date" id="dt"><button class="g" id="go" disabled>⬇ আজকের পাতা ডাউনলোড</button></div>
 <div class="hint" style="margin-top:10px">বাটনে চাপলে ওই তারিখের সব কার্ড একবার প্রিভিউ হবে — লেখা ঠিক করে, প্রতিটা চেক করে নিশ্চিত করলে তবেই ডাউনলোড হবে।</div>
</div>
<div id="rv">
 <div id="top"><button class="o" id="back">← ফিরে যান</button><span id="cnt"></span><button class="g" id="ok" disabled>✔ নিশ্চিত করে ডাউনলোড</button></div>
 <div id="msg"></div><div id="items"></div>
</div>

var files=[],cards=[],$=function(i){return document.getElementById(i)};
var BN='০১২৩৪৫৬৭৮৯',MONTHS=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'],WD=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
function bn(n){return String(n).replace(/[0-9]/g,function(d){return BN[d]})}
function en(s){return String(s).replace(/[০-৯]/g,function(d){return BN.indexOf(d)})}
function pad(n){return('0'+n).slice(-2)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function todayIso(){var n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())}
$('dt').value=todayIso();

/* CSV পার্সার (কোটেশন, BOM, CRLF সহ) */
function parseCSV(t){
 t=t.replace(/^\uFEFF/,'');var rows=[],r=[],f='',q=false,i=0,c;
 for(;i<t.length;i++){c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){r.push(f);f=''}
  else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.some(function(x){return x.trim()}))rows.push(r);r=[]}
  else f+=c}
 if(f||r.length){r.push(f);rows.push(r)}
 var h=rows.shift().map(function(x){return x.trim().toLowerCase()});
 return rows.map(function(a){var o={};h.forEach(function(k,j){o[k]=(a[j]||'').trim()});return o});
}
function normDate(s){s=en(s).trim();var m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);return m?m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]):s}

/* আপলোড */
var drop=$('drop'),fi=$('fi');
drop.onclick=function(){fi.click()};
drop.ondragover=function(e){e.preventDefault();drop.classList.add('on')};
drop.ondragleave=function(){drop.classList.remove('on')};
drop.ondrop=function(e){e.preventDefault();drop.classList.remove('on');add(e.dataTransfer.files)};
fi.onchange=function(){add(fi.files);fi.value=''};
function add(fl){[].forEach.call(fl,function(f){var r=new FileReader();r.onload=function(){
 var rows=[];try{rows=parseCSV(r.result).filter(function(o){return o.series&&o.date&&o.subject})}catch(e){}
 rows.forEach(function(o){o.date=normDate(o.date)});
 files.push({name:f.name,rows:rows});list()};r.readAsText(f,'utf-8')})}
function list(){var l=$('list');l.innerHTML='';
 files.forEach(function(f,i){var d=document.createElement('div');d.className='file';
  var ser={};f.rows.forEach(function(o){ser[o.series]=1});
  d.innerHTML='<span>'+esc(f.name)+' <small>— '+(f.rows.length?esc(Object.keys(ser).join(', '))+' • '+bn(f.rows.length)+' সারি':'কোনো বৈধ সারি পাওয়া যায়নি')+'</small></span><button class="x">✕</button>';
  d.querySelector('.x').onclick=function(){files.splice(i,1);list()};l.appendChild(d)});
 $('go').disabled=!files.some(function(f){return f.rows.length})}

/* গ্রুপ: সিরিজ → টেস্ট → সারিগুলো */
function groups(){var g={};
 files.forEach(function(f){f.rows.forEach(function(o){var k=o.series+'|'+o.test_no+'|'+o.date;
  (g[k]=g[k]||{series:o.series,no:o.test_no,date:o.date,meta:o,rows:[]}).rows.push(o)})});
 return Object.keys(g).map(function(k){return g[k]})}

$('go').onclick=function(){
 var iso=$('dt').value||todayIso(),all=groups(),ser={},list=[];
 all.forEach(function(g){ser[g.series]=1});
 Object.keys(ser).forEach(function(s){
  var gs=all.filter(function(g){return g.series===s}).sort(function(a,b){return a.date<b.date?-1:1});
  var ex=gs.filter(function(g){return g.date===iso});
  if(ex.length)ex.forEach(function(g){list.push({g:g,exact:true})});
  else{var nx=gs.filter(function(g){return g.date>iso})[0];if(nx)list.push({g:nx,exact:false})}
 });
 $('home').style.display='none';$('rv').style.display='block';$('items').innerHTML='';cards=[];window.scrollTo(0,0);
 $('msg').textContent=list.length?'কার্ডের যেকোনো লেখায় ক্লিক করে এডিট করা যায়।':'এই তারিখ বা তার পরে কোনো টেস্ট পাওয়া যায়নি।';
 list.forEach(function(x){build(x.g,x.exact)});upd();
};
$('back').onclick=function(){$('rv').style.display='none';$('home').style.display='block'};

function cardHTML(g){
 var m=g.meta,n=g.rows.length,p=g.date.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
 var ds=bn(pad(+p[2]))+' '+MONTHS[+p[1]-1]+', '+WD[d.getDay()];
 var pd,fs,fl,fm;
 if(n>=5){pd=12;fs=31;fl=32;fm=26}else if(n==4){pd=18;fs=33;fl=33;fm=26}else if(n==3){pd=24;fs=34;fl=34;fm=26}else if(n==2){pd=44;fs=38;fl=40;fm=30}else{pd=70;fs=38;fl=40;fm=30}
 var rows=g.rows.map(function(r,i){var c=/^c[1-5]$/.test(r.color)?r.color:'c'+(i%5+1);
  return '<div class="row z"><table><tr><td class="s '+c+'" style="font-size:'+fl+'px;padding:'+pd+'px 6px '+(pd+3)+'px">'+esc(r.subject)+'<i style="font-size:'+fm+'px">'+esc(r.marks)+'</i></td><td class="t" style="font-size:'+fs+'px;line-height:1.3;padding-top:'+pd+'px;padding-bottom:'+(pd+3)+'px">'+r.syllabus.split('|').map(function(x){return esc(x.trim())}).join('<br>')+'</td></tr></table></div>'}).join('');
 return '<img class="wm" src="'+LOGO+'"><div class="edge"></div>'+
 '<table class="head z"><tr><td style="width:165px"><img src="'+LOGO+'" width="135" height="135"></td><td><div class="brand">TEAM PHARMASTIC</div><div class="tag">'+esc(m.tagline)+'</div></td></tr></table>'+
 '<div class="title z"><div class="pill">'+esc(m.pill)+'</div><div class="sub">'+esc(m.sub)+'</div></div>'+
 '<table class="info z"><tr><td class="l"><div class="box"><div class="lab">তারিখ</div><div class="val">'+ds+'</div></div></td><td class="r"><div class="box"><div class="lab">পরীক্ষার সময়</div><div class="val">'+esc(m.time)+'</div></div></td></tr></table>'+
 '<div class="marks z"><span class="mk">'+esc(m.mark_line)+'</span></div><div class="sech z">▼ &nbsp;পরীক্ষার সিলেবাস ও মানবণ্টন&nbsp; ▼</div>'+rows+
 '<div class="foot z"><div class="best">'+esc(m.footer)+'</div><div class="web">'+esc(m.web)+'</div></div>';
}
function build(g,exact){
 var c={g:g,chk:false,off:false},it=document.createElement('div');it.className='item';
 it.innerHTML='<div class="ih"><b>'+esc(g.series)+' — টেস্ট '+esc(g.no)+'</b><button class="o ex">বাদ দিন</button><label><input type="checkbox"> চেক করেছি</label>'+(exact?'':'<div class="warn">⚠ এই তারিখে এই সিরিজে পরীক্ষা নেই — পরের টেস্ট ('+esc(g.date)+') দেখানো হচ্ছে। দরকার না হলে "বাদ দিন" চাপুন।</div>')+'</div><div class="holder"><div class="stage"><div class="card">'+cardHTML(g)+'</div></div></div>';
 $('items').appendChild(it);c.el=it;c.st=it.querySelector('.stage');c.hd=it.querySelector('.holder');c.cd=it.querySelector('.card');
 ['.brand','.tag','.pill','.sub','.lab','.val','.mk','.sech','.row td','.best','.web'].forEach(function(q){[].forEach.call(c.cd.querySelectorAll(q),function(e){e.setAttribute('contenteditable','true')})});
 it.querySelector('.ex').onclick=function(){c.off=!c.off;it.classList.toggle('off',c.off);this.textContent=c.off?'যোগ করুন':'বাদ দিন';upd()};
 var cb=it.querySelector('input');cb.onchange=function(){c.chk=cb.checked;upd()};
 c.cd.addEventListener('input',function(){fit(c)});cards.push(c);fit(c);setTimeout(function(){fit(c)},300);
}
function fit(c){var h=c.cd.offsetHeight||1350,s=Math.min(1,(c.el.clientWidth-24)/1080);
 c.st.style.transform='scale('+s+')';c.hd.style.height=(h*s)+'px';c.hd.style.width=(1080*s)+'px'}
window.addEventListener('resize',function(){cards.forEach(fit)});
function upd(){var on=cards.filter(function(c){return!c.off}),done=on.filter(function(c){return c.chk}).length;
 $('cnt').textContent=bn(done)+'/'+bn(on.length)+' চেক হয়েছে';$('ok').disabled=!(on.length&&done===on.length)}

/* ডাউনলোড */
function save(b,n){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove()}
function shot(c){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
 return html2canvas(c.cd,{scale:1,width:1080,height:c.cd.offsetHeight,backgroundColor:'#0a2468',
  onclone:function(d){[].forEach.call(d.querySelectorAll('[contenteditable]'),function(e){e.removeAttribute('contenteditable')});
   [].forEach.call(d.querySelectorAll('.stage'),function(s){s.style.transform='none'});[].forEach.call(d.querySelectorAll('.holder'),function(s){s.style.width='auto';s.style.height='auto';s.style.border='0'})}})}
$('ok').onclick=function(){
 var on=cards.filter(function(c){return!c.off}),msg=$('msg'),i=0,zip=window.JSZip?new JSZip():null,out=[];$('ok').disabled=true;
 (function next(){
  if(i>=on.length){
   if(on.length===1||!zip)out.forEach(function(o){save(o.b,o.n)});
   else{zip.generateAsync({type:'blob'}).then(function(b){save(b,'notice_cards_'+on[0].g.date+'.zip')})}
   msg.textContent='ডাউনলোড হয়েছে ✔';$('ok').disabled=false;return}
  msg.textContent='তৈরি হচ্ছে '+bn(i+1)+'/'+bn(on.length)+' ...';
  shot(on[i]).then(function(cv){cv.toBlob(function(b){var g=on[i].g,n=(g.series+'_'+pad(+en(g.no)||0)+'_'+g.date+'.png').replace(/[\\\/:*?"<>|]/g,'_');
   out.push({b:b,n:n});if(zip)zip.file(n,b);i++;setTimeout(next,60)},'image/png')})
  .catch(function(){msg.textContent='ব্যর্থ হয়েছে — ইন্টারনেট চালু আছে কিনা দেখুন, Chrome-এ খুলুন';$('ok').disabled=false});
 })();
};
</script></body></html>
